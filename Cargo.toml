[workspace]
members = ["programs/*", "test-suite"]
# The fuzz crate uses a nightly toolchain and must stay out of the workspace.
exclude = ["fuzz"]
resolver = "2"

# Host-side dev/test builds do not need debug info; dropping it keeps the
# workspace target/ small (the deployed program uses its own SBF profile and is
# unaffected). Incremental stays on for normal edit speed.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
