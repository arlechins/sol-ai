[workspace]
members = ["programs/*", "test-suite"]
# The fuzz crate uses a nightly toolchain and must stay out of the workspace.
exclude = ["fuzz"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
