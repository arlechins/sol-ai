[package]
name = "taop_reputation"
version = "0.1.0"
description = "TAOP reputation program for Solana: bonded completions, challenges, score decay, and a bonded capability registry"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "taop_reputation"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
init-if-needed = ["anchor-lang/init-if-needed"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }

[dev-dependencies]
proptest = "1"
