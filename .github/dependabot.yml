version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      solana:
        patterns:
          - "solana-*"
          - "anchor-*"
          - "litesvm*"
    ignore:
      # Majors are reviewed and applied by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pre-1.0 crates treat minors as breaking; pin deliberately.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "anchor-lang"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "proptest"
        update-types: ["version-update:semver-minor"]

  # NOTE: this is a pnpm workspace with a single root lockfile. Dependabot
  # cannot update npm dependencies from a workspace subdirectory
  # ("misconfigured_tooling: Updating workspaces from inside a workspace
  # subdirectory is not supported"), so keep exactly one root npm entry and
  # never add per-package directories here.
  #
  # Two advisories are deliberately dismissed on GitHub (not ignored here,
  # since ignore rules do not apply to security updates):
  #   - stream-json (moderate): stream-json 3.x renamed the subpaths jayson
  #     requires, so the "fix" breaks the RPC client. See SECURITY.md.
  #   - rand (low): dev-only via litesvm/libsecp256k1, no patched 0.7.x.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      anchor-and-solana:
        patterns:
          - "@anchor-lang/*"
          - "@solana/*"
    ignore:
      # Majors are reviewed and applied by hand (except security updates, which
      # Dependabot raises regardless of these rules).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
