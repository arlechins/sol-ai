name: Devnet healthcheck

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Read-only deployment check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run healthcheck
        run: pnpm healthcheck
        env:
          SOLANA_RPC_URL: https://api.devnet.solana.com
          # Detects an undocumented authority change. Update deliberately when
          # the authority rotates (e.g. to the Squads vault on mainnet).
          TAOP_EXPECTED_UPGRADE_AUTHORITY: bxFpYgz8F4rbwLWTGbjuPtY4tmUZVQwMLSLSkG9TFq2
