name: Devnet healthcheck

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Read-only deployment check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run healthcheck
        run: pnpm healthcheck
        env:
          SOLANA_RPC_URL: https://api.devnet.solana.com
          # Detects an undocumented authority change. Update deliberately when
          # the authority rotates (e.g. to the Squads vault on mainnet).
          TAOP_EXPECTED_UPGRADE_AUTHORITY: bxFpYgz8F4rbwLWTGbjuPtY4tmUZVQwMLSLSkG9TFq2
