name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "4.2.2"
  ANCHOR_VERSION: "1.1.2"

jobs:
  program:
    name: Program (build + Rust tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true

      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          # sha256 is for v1.1.2; bump it alongside ANCHOR_VERSION.
          echo "fdea9979629e9416e5f5e5622ff6c11b8c691d1e559581ece368e903c0c980c1  $HOME/.local/bin/anchor" | sha256sum -c -
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          anchor --version

      - name: Sync program keypair
        run: ./scripts/sync-keypair.sh

      # The test suite include_bytes!()s target/deploy/taop_reputation.so and
      # declare_program! reads the IDL, so the build must come before any Rust
      # lint or test step on a clean checkout.
      - name: Build program
        run: anchor build

      - name: Sync IDL for Rust tests and SDK
        run: ./scripts/sync-idl.sh

      - name: Verify committed IDL has no drift
        run: ./scripts/check-idl-sync.sh

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets

      - name: Program tests (LiteSVM)
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-audit

      - name: Dependency audit
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny

      - name: Dependency policy (licenses, bans, sources)
        run: cargo-deny check licenses bans sources

      - name: Install nightly toolchain (fuzz target compile check)
        run: rustup toolchain install nightly --profile minimal

      - name: Compile fuzz targets
        run: cargo +nightly build --manifest-path fuzz/Cargo.toml --bins

  packages:
    name: Packages (SDK, MCP, example, benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          # sha256 is for v1.1.2; bump it alongside ANCHOR_VERSION.
          echo "fdea9979629e9416e5f5e5622ff6c11b8c691d1e559581ece368e903c0c980c1  $HOME/.local/bin/anchor" | sha256sum -c -
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync program keypair
        run: ./scripts/sync-keypair.sh

      - name: Build program and sync IDL
        run: anchor build && ./scripts/sync-idl.sh

      - name: Typecheck and build packages
        run: |
          pnpm --filter @taopp/solana build
          pnpm --filter @taopp/mcp-server build
          pnpm --filter @taopp/webhooks build
          pnpm -r --if-present typecheck

      - name: Package lint (publint + arethetypeswrong)
        run: pnpm run lint:packages

      - name: ESM and CJS import smoke
        run: |
          node --input-type=module -e "import('@taopp/solana').then(m => { if (!m.TaopSolanaClient) throw new Error('missing ESM export'); console.log('esm ok'); })"
          node -e "const m = require('@taopp/solana'); if (!m.TaopSolanaClient) throw new Error('missing CJS export'); console.log('cjs ok');"
          # Node 20/22 miss Anchor's getter-style BN re-export; the SDK guards
          # against it, and this asserts the underlying assumption still holds.
          node --input-type=module -e "import * as anchor from '@anchor-lang/core'; const m = typeof anchor.BN === 'function' ? anchor : anchor.default; if (typeof m.BN !== 'function') throw new Error('BN interop unavailable'); console.log('bn interop ok');"

      - name: Start local validator and deploy program
        run: ./scripts/localnet.sh

      - name: Package tests (unit + local-validator integration)
        run: pnpm -r --if-present test
        env:
          TAOP_RPC_URL: http://127.0.0.1:8899

      - name: SDK coverage (against local validator)
        run: pnpm --filter @taopp/solana test:coverage
        env:
          TAOP_RPC_URL: http://127.0.0.1:8899

      - name: Web coverage
        run: pnpm --filter @taopp/web test:coverage

      - name: Enforce coverage ratchet
        run: |
          node scripts/check-coverage.mjs sdk packages/solana/coverage/coverage-summary.json
          node scripts/check-coverage.mjs web apps/web/coverage/coverage-summary.json

      # End-to-end: runs the two-agent trust loop against the local validator
      # (bootstraps config if needed, reclaims bonds, sweeps test SOL).
      - name: Example trust loop (local validator)
        run: |
          TAOP_E2E_CLUSTER=localnet \
            TAOP_E2E_KEYPAIR="$HOME/.config/solana/id.json" \
            node scripts/devnet-e2e.mjs

      - name: Benchmark smoke run
        run: pnpm --filter @taopp/benchmark start -- --seed 7 --json-only --out /tmp/benchmark-smoke

      - name: Audit JS dependencies
        run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  # Scans the FULL git history for secrets; the working tree is already covered
  # by the gitignore guard. Pinned + checksum-verified gitleaks.
  secrets-history:
    name: Secret history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (v8.30.1, checksum-verified)
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xf /tmp/gitleaks.tar.gz -C /tmp

      - name: Scan full history for secrets
        run: /tmp/gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
