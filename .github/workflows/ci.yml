name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "4.2.2"
  ANCHOR_VERSION: "1.1.2"

jobs:
  program:
    name: Program (build + Rust tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true

      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          anchor --version

      - name: Sync program keypair
        run: ./scripts/sync-keypair.sh

      # The test suite include_bytes!()s target/deploy/taop_reputation.so and
      # declare_program! reads the IDL, so the build must come before any Rust
      # lint or test step on a clean checkout.
      - name: Build program
        run: anchor build

      - name: Sync IDL for Rust tests and SDK
        run: ./scripts/sync-idl.sh

      - name: Verify committed IDL has no drift
        run: ./scripts/check-idl-sync.sh

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets

      - name: Program tests (LiteSVM)
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-audit

      - name: Dependency audit
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny

      - name: Dependency policy (licenses, bans, sources)
        run: cargo-deny check licenses bans sources

  packages:
    name: Packages (SDK, MCP, example, benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Solana CLI (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync program keypair
        run: ./scripts/sync-keypair.sh

      - name: Build program and sync IDL
        run: anchor build && ./scripts/sync-idl.sh

      - name: Typecheck and build packages
        run: |
          pnpm --filter @taopp/solana build
          pnpm --filter @taopp/mcp-server build
          pnpm -r --if-present typecheck

      - name: Package lint (publint + arethetypeswrong)
        run: pnpm run lint:packages

      - name: ESM and CJS import smoke
        run: |
          node --input-type=module -e "import('@taopp/solana').then(m => { if (!m.TaopSolanaClient) throw new Error('missing ESM export'); console.log('esm ok'); })"
          node -e "const m = require('@taopp/solana'); if (!m.TaopSolanaClient) throw new Error('missing CJS export'); console.log('cjs ok');"

      - name: Start local validator and deploy program
        run: ./scripts/localnet.sh

      - name: Package tests (unit + local-validator integration)
        run: pnpm -r --if-present test
        env:
          TAOP_RPC_URL: http://127.0.0.1:8899

      - name: Benchmark smoke run
        run: pnpm --filter @taopp/benchmark start -- --seed 7 --json-only --out /tmp/benchmark-smoke

      - name: Audit JS dependencies
        run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
