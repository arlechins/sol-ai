name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag or ref to publish from
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Disabled until npm authentication is configured (trusted publishing on
    # npmjs.com, or the NPM_TOKEN secret). Enable by setting the repository
    # variable NPM_PUBLISH=true, or run this workflow manually.
    if: github.event_name == 'workflow_dispatch' || vars.NPM_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write # npm trusted publishing / provenance via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install current npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Build and test
        run: |
          pnpm --filter @taopp/solana build
          pnpm --filter @taopp/solana test
          pnpm --filter @taopp/mcp-server build
          pnpm --filter @taopp/mcp-server test

      - name: Package lint
        run: pnpm run lint:packages

      - name: Publish @taopp/solana
        working-directory: packages/solana
        run: npm publish --provenance --access public
        env:
          # Only used when trusted publishing is not configured for the package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @taopp/mcp-server
        working-directory: packages/mcp-server
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # attach the SBOM to the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: taop-solana.spdx.json
          artifact-name: taop-solana.spdx.json
          upload-release-assets: ${{ github.event_name == 'release' }}
