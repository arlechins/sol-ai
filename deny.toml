# cargo-deny policy: licenses, duplicate versions, and crate sources.
# Advisories are covered by `cargo audit` in CI; keep this file focused on
# license and supply-chain policy.
[graph]
all-features = false

[licenses]
# Only these licenses may appear in the dependency graph. Extend deliberately
# and record the reason in the commit message.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9
# The allowlist is deliberately broader than the current graph so that adding a
# dependency with a common license does not fail the build unexpectedly.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
