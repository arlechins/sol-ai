[package]
name = "taop-reputation-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The program is built with `no-entrypoint` here so the test binaries do not
# export a second `entrypoint` symbol next to the one from `spl-token`
# (pulled in by anchor-litesvm). Linux lld rejects duplicate symbols.
[dependencies]
taop_reputation = { version = "0.1.0", path = "../programs/taop_reputation", default-features = false, features = ["no-entrypoint"] }

[dev-dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-litesvm = "0.4.0"
bincode = "1"
sha2 = "0.10"
solana-clock = "3.2"
solana-keypair = "3.1.2"
solana-loader-v3-interface = "6"
solana-program = "3.0.0"
solana-signer = "3.0.0"
solana-system-interface = "3.0"
solana-transaction = { version = "3.0.1", features = ["bincode"] }
