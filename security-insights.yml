header:
  schema-version: 2.0.0
  last-updated: "2026-09-18"
  last-reviewed: "2026-09-18"
  url: https://github.com/arlechins/sol-ai/blob/main/security-insights.yml
  comment: |
    Security Insights for the TAOP reputation monorepo.

project:
  name: TAOP reputation on Solana
  homepage: https://github.com/arlechins/sol-ai
  administrators:
    - name: arlechins
      primary: true
  repositories:
    - url: https://github.com/arlechins/sol-ai
      comment: |
        Monorepo: Anchor program (programs/taop_reputation), TypeScript SDK
        (packages/solana), MCP server (packages/mcp-server), evaluation harness
        and adversarial dataset (benchmark/).
  license:
    - name: MIT
      url: https://github.com/arlechins/sol-ai/blob/main/LICENSE
    - name: CC-BY-4.0 (dataset only)
      url: https://github.com/arlechins/sol-ai/blob/main/benchmark/dataset/LICENSE-CC-BY-4.0
  lifecycle: active
  release:
    name: v0.2.0
    url: https://github.com/arlechins/sol-ai/releases/tag/v0.2.0
    date: "2026-09-18"

security-contacts:
  - type: policy
    value: https://github.com/arlechins/sol-ai/security/policy
    primary: true

vulnerability-reporting:
  reports-accepted: true
  bug-bounty-available: false
  contact:
    policy: https://github.com/arlechins/sol-ai/security/policy
    advisory: https://github.com/arlechins/sol-ai/security/advisories/new
  comment: |
    Report privately via GitHub Security Advisories. Acknowledgement target is
    7 days; remediation timeline within 14 days of confirmation. See SECURITY.md
    for known, documented advisories and the trust boundaries that are out of
    scope.

documentation:
  detailed-guide:
    - url: https://github.com/arlechins/sol-ai/blob/main/docs/architecture.md
    - url: https://github.com/arlechins/sol-ai/blob/main/docs/account-layout.md
  api:
    - url: https://github.com/arlechins/sol-ai/blob/main/packages/solana/README.md
  security:
    - url: https://github.com/arlechins/sol-ai/blob/main/docs/threat-model.md
    - url: https://github.com/arlechins/sol-ai/blob/main/docs/security-review.md
  reviewers-listing:
    - url: https://github.com/arlechins/sol-ai/blob/main/SECURITY.md

security-testing:
  - type: unit
    comment: |
      101 Rust tests via LiteSVM (including a compute-unit regression snapshot)
      plus SDK (21), MCP (15), webhooks (10), website (65), and benchmark (17)
      suites. Coverage ratchets (coverage-baseline.json) enforce SDK and web
      baselines in CI.
  - type: integration
    comment: |
      Local-validator SDK/webhook integration tests in CI, a 6-hourly devnet
      healthcheck that verifies the on-chain executable hash and config against
      the published descriptor, and a manual-dispatch devnet E2E that runs the
      full attest -> challenge -> resolve loop with throwaway agents.
  - type: fuzzing
    comment: |
      cargo-fuzz targets for the score function, ProgramData parser, and account
      decoding run weekly; a curated mutation spot-check (scripts/mutation-
      spotcheck.py, 16 seeded faults) runs weekly and fails if any survives.
  - type: static-analysis
    comment: cargo clippy, CodeQL (JavaScript/TypeScript), pnpm audit, cargo audit,
      cargo-deny (licenses/bans/sources).
  - type: supply-chain
    comment: |
      Dependabot, dependency review, OpenSSF Scorecard, actions pinned to SHAs,
      gitleaks scanning the full git history, and checksum-verified Anchor /
      solana-verify downloads in CI.
  - type: provenance
    comment: |
      .github/workflows/release.yml publishes npm packages via trusted publishing
      (OIDC) with provenance; workflows are SHA-pinned with an allowlist and
      content-read default permissions.
  - type: reproducible-build
    comment: |
      scripts/verify-build.sh rebuilds in the pinned Anchor Docker image and
      compares the executable hash with the deployed program via solana-verify;
      the weekly "Verifiable build" workflow runs the same check. Devnet is
      currently hash-identical to the reproducible build.
